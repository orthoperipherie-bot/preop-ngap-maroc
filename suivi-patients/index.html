<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#app{min-height:100dvh;background:var(--bg);padding-bottom:calc(86px + env(safe-area-inset-bottom))}.shell{width:min(100%,850px);margin:0 auto}.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 17px 12px}.brandline{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,#287de3,#123f8c);font-size:22px;font-weight:900}.brand{font-weight:850;font-size:18px;letter-spacing:-.5px}.tagline{color:var(--muted);font-size:10px;margin-top:3px}.topAction{margin-left:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:750}main{padding:17px 15px 20px}.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:850}.hero{border-radius:24px;padding:23px 20px;background:radial-gradient(circle at 92% 4%,rgba(106,172,255,.45),transparent 36%),linear-gradient(140deg,#15396e,#176bcf 68%,#378be7);color:#f6f9ff;box-shadow:0 14px 28px rgba(23,76,147,.17)}.hero .eyebrow{color:#c5ddff}.hero h1{font-size:30px;line-height:1.06;letter-spacing:-1.1px;margin:8px 0}.hero p{font-size:13px;line-height:1.5;color:#dceaff;margin:10px 0 17px;max-width:560px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;background:#ffffff17;border:1px solid #ffffff33;border-radius:13px}.stat strong{display:block;font-size:22px}.stat span{font-size:10px;color:#dceaff}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:23px 1px 12px}.sectionhead h2{font-size:21px;letter-spacing:-.5px;margin:4px 0 0}.muted{color:var(--muted);font-size:12px}.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 13px;min-height:47px}.search input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;min-width:0}.list{display:grid;gap:9px}.patient{display:flex;align-items:center;gap:12px;padding:14px;border-radius:17px;border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--ink);width:100%;min-width:0}.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--bluewash);color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:13px}.patientText{min-width:0;flex:1}.patientText strong{display:block;font-size:14px}.patientText p{margin:4px 0 0;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.chev{color:var(--muted);font-size:22px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:19px;padding:16px;margin-top:12px}.panel h3{margin:0;font-size:15px}.panel p.lead{margin:6px 0 12px;color:var(--muted);font-size:12px;line-height:1.5}.row{display:flex;gap:9px;align-items:center}.row>*{min-width:0}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.field{margin-top:12px}.field label,.flabel{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field small,.hint{display:block;font-size:10px;color:var(--muted);line-height:1.45;margin-top:5px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:12px;outline:0;min-width:0}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--bluewash)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid transparent;border-radius:13px;padding:12px 14px;font-weight:800;font-size:12px}.primary{background:var(--blue);color:#fff}.secondary{background:var(--panel);color:var(--ink);border-color:var(--line)}.danger{background:transparent;color:var(--red);border-color:var(--line)}.wide{width:100%}.actionrow{display:flex;gap:8px;margin-top:13px}.actionrow>*{flex:1}.notice{background:var(--bluewash);border-radius:13px;padding:12px 13px;font-size:11px;line-height:1.5;margin-top:12px}.notice.warn{background:color-mix(in srgb,var(--amber) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 33%,var(--line))}.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:10px;font-weight:750}.badge.good{background:color-mix(in srgb,var(--green) 12%,var(--panel));color:var(--green)}.badge.warn{background:color-mix(in srgb,var(--amber) 12%,var(--panel));color:var(--amber)}.tabbar{display:flex;gap:7px;overflow:auto;margin:13px 0}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 12px;font-size:11px;font-weight:800;white-space:nowrap}.tab.active{background:var(--blue);border-color:var(--blue);color:white}.timeline{display:grid;gap:11px}.visit{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px}.visithead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.visithead strong{font-size:13px}.visithead time{font-size:10px;color:var(--muted)}.visit p{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--muted)}.scorechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.scorechip{background:var(--bluewash);color:var(--blue);border-radius:9px;padding:7px 8px;font-size:10px;font-weight:800}.score-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score-option{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:11px;font-weight:750;background:var(--panel)}.score-option input{accent-color:var(--blue);width:17px;height:17px}.scorebox{border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:12px;background:color-mix(in srgb,var(--bluewash) 20%,var(--panel))}.scorebox h4{margin:0;font-size:13px}.scorebox .desc{color:var(--muted);font-size:10px;line-height:1.45;margin:5px 0 10px}.itemgrid{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,43%);gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item span{font-size:11px;font-weight:650;line-height:1.4}.item select{width:100%;min-width:0;padding:10px 7px;font-size:11px}.calcresult{margin-top:11px;padding:12px;border-radius:12px;background:var(--bluewash);display:flex;gap:10px;align-items:center;justify-content:space-between}.calcresult strong{font-size:20px;color:var(--blue)}.calcresult span{font-size:10px;color:var(--muted);text-align:right;max-width:60%}.chart{display:grid;gap:9px}.trendrow{display:grid;grid-template-columns:94px 1fr 57px;gap:7px;align-items:center;font-size:10px}.trendtrack{height:7px;background:var(--soft);border-radius:99px;overflow:hidden}.trendbar{height:100%;border-radius:99px;background:var(--blue)}.empty{padding:26px 15px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:12px;line-height:1.5}.bottom{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 15px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottominner{width:min(100%,560px);margin:auto;display:flex;justify-content:space-around}.nav{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:4px 8px;font-size:10px;font-weight:800;min-width:70px}.nav b{font-size:20px;font-weight:500}.nav.active{color:var(--blue)}.rule{height:1px;background:var(--line);margin:14px 0}.disclaimer{font-size:10px;color:var(--muted);line-height:1.5;margin:17px 3px 3px}
@media(min-width:650px){main{padding:24px}.patientlist{grid-template-columns:1fr 1fr}.hero{padding:28px}.bottom{display:none}#app{padding-bottom:25px}.score-options{grid-template-columns:repeat(3,1fr)}}
@media(max-width:380px){.grid2{grid-template-columns:1fr}.score-options{grid-template-columns:1fr}.item{grid-template-columns:minmax(0,1fr) minmax(115px,45%)}.hero h1{font-size:27px}}
</style>

<body>
<div id="app">
<header class="top"><div class="shell brandline"><div class="logo">O+</div><div><div class="brand">OrthoSuivi</div><div class="tagline">SUIVI CLINIQUE · CHIRURGIE ORTHOPÉDIQUE</div></div><button id="quickAdd" class="topAction">+ Patient</button></div></header>
<main id="main" class="shell"></main>
<nav class="bottom"><div class="bottominner">
<button class="nav active" data-view="dashboard"><b>⌂</b>Accueil</button>
<button class="nav" data-view="patients"><b>♙</b>Patients</button>
<button class="nav" data-view="recent"><b>◷</b>Suivis</button>

</div></nav>

<script>
(function(){
"use strict";
var STORE="orthosuivi_patients_v1";
var state={view:"dashboard",patients:[],query:"",selectedId:null,draftScores:{},draftVisit:{},scoreSelection:["mjoa"],editingPatient:null};
try{state.patients=JSON.parse(localStorage.getItem(STORE)||"[]");if(!Array.isArray(state.patients))state.patients=[];}catch(e){state.patients=[];}
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var today=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
var dateFmt=function(v){if(!v)return "Date non renseignée";return new Date(v+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});};
var save=function(){try{localStorage.setItem(STORE,JSON.stringify(state.patients));return true;}catch(e){alert("Stockage local indisponible ou plein. Exportez vos données et libérez de l’espace.");return false;}};
var scoreMeta={
 quickdash:{name:"QuickDASH",max:100,dir:"higher-worse",desc:"11 items, réponses 1 à 5 ; au moins 10/11 réponses sont nécessaires. Les items doivent être renseignés à partir du questionnaire autorisé."},
 womac:{name:"WOMAC (Likert)",max:96,dir:"higher-worse",desc:"24 items cotés 0–4 ; vérifier que votre formulaire correspond à la version Likert."},
 lefs:{name:"LEFS",max:80,dir:"higher-better",desc:"20 activités, 0 = difficulté extrême/incapable, 4 = aucune difficulté."},
 mjoa:{name:"mJOA cervical",max:18,dir:"higher-better",desc:"4 domaines cliniques avec cotation guidée, total sur 18."},
 ohs:{name:"Oxford Hip Score",max:48,dir:"higher-better",desc:"12 items cotés depuis un formulaire autorisé. Ne pas afficher/reproduire les questions protégées."},
 oks:{name:"Oxford Knee Score",max:48,dir:"higher-better",desc:"12 items cotés depuis un formulaire autorisé. Ne pas afficher/reproduire les questions protégées."},
 tegner:{name:"Tegner Activity Scale",max:10,dir:"higher-better",desc:"Niveau ordinal de 0 à 10, à choisir à partir de la grille de référence."},
 constant:{name:"Constant–Murley (sous-scores)",max:100,dir:"higher-better",desc:"Choisissez les points de chaque rubrique après examen et cotation selon le protocole Constant."},
 hhs:{name:"Harris Hip Score (sous-scores)",max:100,dir:"higher-better",desc:"Choisissez les sous-scores établis avec la grille HHS de référence."}
};
var scoreChoices=[
 {id:"quickdash",label:"QuickDASH",desc:"Épaule, coude, poignet-main"},
 {id:"constant",label:"Constant–Murley",desc:"Épaule"},
 {id:"ohs",label:"Oxford Hip Score",desc:"Hanche / PTH"},
 {id:"oks",label:"Oxford Knee Score",desc:"Genou / PTG"},
 {id:"womac",label:"WOMAC",desc:"Arthrose hanche-genou"},
 {id:"lefs",label:"LEFS",desc:"Membre inférieur"},
 {id:"mjoa",label:"mJOA cervical",desc:"Myélopathie cervicale"},
 {id:"hhs",label:"Harris Hip Score",desc:"Hanche"},
 {id:"tegner",label:"Tegner",desc:"Activité / sport"}
];
var mjoaFields=[
 {key:"ue",label:"Motricité des membres supérieurs",max:5,options:[[0,"0 — impossible de bouger les mains"],[1,"1 — mouvements possibles, mais ne peut pas se nourrir seul"],[2,"2 — peut se nourrir, mais ne peut pas boutonner"],[3,"3 — boutonnage très difficile"],[4,"4 — légère difficulté au boutonnage"],[5,"5 — fonction des mains normale"]]},
 {key:"le",label:"Motricité des membres inférieurs",max:7,options:[[0,"0 — perte motrice et sensitive complète"],[1,"1 — sensibilité conservée, aucun mouvement volontaire"],[2,"2 — mouvements possibles, marche impossible"],[3,"3 — marche avec une aide"],[4,"4 — escaliers avec rampe"],[5,"5 — escaliers sans rampe, instabilité notable"],[6,"6 — marche autonome, légère instabilité"],[7,"7 — marche normale"]]},
 {key:"sens",label:"Sensibilité des membres supérieurs",max:3,options:[[0,"0 — perte sensitive complète"],[1,"1 — perte sévère ou douleur constante"],[2,"2 — perte légère / paresthésies"],[3,"3 — sensibilité normale"]]},
 {key:"bladder",label:"Fonction vésicale",max:3,options:[[0,"0 — incapacité à uriner volontairement"],[1,"1 — difficulté marquée"],[2,"2 — difficulté légère à modérée"],[3,"3 — miction normale"]]}
];
function blankScore(id){return {values:{}};}
function options(min,max,labels){var s='<option value="">Choisir…</option>';for(var i=min;i<=max;i++)s+='<option value="'+i+'">'+esc(labels?labels[i-min]:String(i))+'</option>';return s;}
function commonScoreForm(id,v){
 var s="",i,fields=[],labels=[],values=v||{};
 if(id==="mjoa"){fields=mjoaFields;return '<div class="itemgrid">'+fields.map(function(f){return '<label class="item"><span>'+esc(f.label)+'</span><select class="select" data-sid="'+id+'" data-key="'+f.key+'"><option value="">Choisir la description…</option>'+f.options.map(function(o){return '<option value="'+o[0]+'" '+(String(values[f.key])===String(o[0])?"selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select></label>';}).join("")+'</div>';}
 if(id==="quickdash"||id==="lefs"||id==="womac"||id==="ohs"||id==="oks"){
  var count=id==="quickdash"?11:id==="womac"?24:id==="lefs"?20:12;
  var min=id==="quickdash"?1:0,max=id==="quickdash"?5:id==="womac"?4:4;
  var itemName=id==="womac"?(i<5?"Douleur":i<7?"Raideur":"Fonction"):"Item";
  for(i=1;i<=count;i++){
   var caption=id==="womac"?(i<=5?"Douleur":i<=7?"Raideur":"Fonction"):id==="lefs"?"Difficulté pour cette activité":id==="quickdash"?"Réponse du questionnaire autorisé":"Réponse du questionnaire autorisé";
   var lab=id==="womac"?({0:"0 — aucun",1:"1 — léger",2:"2 — modéré",3:"3 — sévère",4:"4 — extrême"}):id==="lefs"?({0:"0 — difficulté extrême / incapable",1:"1 — grande difficulté",2:"2 — difficulté modérée",3:"3 — légère difficulté",4:"4 — aucune difficulté"}):id==="quickdash"?({1:"1 — pas de difficulté / aucun symptôme",2:"2 — difficulté / symptôme léger",3:"3 — difficulté / symptôme modéré",4:"4 — difficulté / symptôme sévère",5:"5 — incapable / symptôme extrême"}):({0:"0 — réponse la plus défavorable",1:"1 — réponse du formulaire",2:"2 — réponse du formulaire",3:"3 — réponse du formulaire",4:"4 — réponse la plus favorable"});
   s+='<label class="item"><span>Item '+String(i).padStart(2,"0")+'<small class="hint">'+caption+'</small></span><select class="select" data-sid="'+id+'" data-key="i'+i+'">'+options(min,max,Array.from({length:max-min+1},function(_,j){return lab[j+min]||String(j+min);})).replace('value="'+values["i"+i]+'"','value="'+values["i"+i]+'"')+'</select></label>';
  }
  return '<div class="itemgrid">'+s+'</div>'+(id==="ohs"||id==="oks"?'<p class="hint">Utiliser exclusivement le formulaire autorisé correspondant. Les libellés d’items ne sont pas reproduits ; la cotation doit suivre la version exacte du questionnaire.</p>':"");
 }
 if(id==="tegner"){var descriptions=["0 — arrêt / handicap empêchant l’activité","1 — activité très légère selon la grille Tegner","2 — activité faible selon la grille Tegner","3 — activité modérée selon la grille Tegner","4 — activité professionnelle ou sportive selon la grille","5 — activité récréative soutenue selon la grille","6 — sport récréatif plus exigeant selon la grille","7 — sport régulier selon la grille","8 — sport de compétition selon la grille","9 — sport compétitif de haut niveau selon la grille","10 — niveau maximal de compétition selon la grille"];return '<label class="item"><span>Niveau d’activité selon la grille</span><select class="select" data-sid="tegner" data-key="level">'+options(0,10,descriptions)+'</select></label><p class="hint">Les descriptions sont des repères généraux, pas un substitut à la grille de cotation publiée.</p>';}
 if(id==="constant"){fields=[{key:"pain",label:"Douleur (0–15)",max:15},{key:"adl",label:"Activités quotidiennes (0–20)",max:20},{key:"rom",label:"Mobilité (0–40)",max:40},{key:"strength",label:"Force (0–25)",max:25}];}
 if(id==="hhs"){fields=[{key:"pain",label:"Douleur (0–44)",max:44},{key:"function",label:"Fonction (0–47)",max:47},{key:"deformity",label:"Absence de déformation (0–4)",max:4},{key:"rom",label:"Mobilité (0–5)",max:5}];}
 return '<div class="itemgrid">'+fields.map(function(f){return '<label class="item"><span>'+esc(f.label)+'<small class="hint">Choisir la valeur cotée avec la grille clinique.</small></span><select class="select" data-sid="'+id+'" data-key="'+f.key+'">'+options(0,f.max)+'</select></label>';}).join("")+'</div>';
}
function computeScore(id,values){
 var vals=values||{},keys=Object.keys(vals),nums=[],i,total=0,count=0,needed=0,sub="",max=scoreMeta[id].max;
 if(id==="mjoa"){needed=4;var fs=mjoaFields;for(i=0;i<fs.length;i++){var v=vals[fs[i].key];if(v!==undefined&&v!==""){total+=Number(v);count++;}}if(count!==needed)return {valid:false,value:null,max:max,answered:count,needed:needed,progress:count/needed*100,sub:""};sub="Membres supérieurs "+vals.ue+"/5 · Membres inférieurs "+vals.le+"/7 · Sensibilité "+vals.sens+"/3 · Vessie "+vals.bladder+"/3";var grade=total<=11?"Sévère (0–11)":total<=14?"Modérée (12–14)":total<=17?"Légère (15–17)":"18/18";return {valid:true,value:total,max:max,answered:count,needed:needed,progress:100,sub:sub,interpretation:grade};}
 if(id==="quickdash"||id==="womac"||id==="lefs"||id==="ohs"||id==="oks"){
  needed=id==="quickdash"?11:id==="womac"?24:id==="lefs"?20:12;
  for(i=1;i<=needed;i++){var item=vals["i"+i];if(item!==undefined&&item!==""){count++;total+=Number(item);}}
  var minNeed=id==="quickdash"?10:needed;
  if(count<minNeed)return {valid:false,value:null,max:max,answered:count,needed:minNeed,progress:count/needed*100,sub:""};
  if(id==="quickdash")total=Math.round(((total/count)-1)*25*10)/10;
  sub=count+"/"+needed+" items renseignés";
  if(id==="womac"){var all=Array.from({length:24},function(_,j){return vals["i"+(j+1)]===""||vals["i"+(j+1)]===undefined?0:Number(vals["i"+(j+1)]);});sub="Douleur "+all.slice(0,5).reduce(function(a,b){return a+b;},0)+"/20 · Raideur "+all.slice(5,7).reduce(function(a,b){return a+b;},0)+"/8 · Fonction "+all.slice(7).reduce(function(a,b){return a+b;},0)+"/68";}
  return {valid:true,value:total,max:max,answered:count,needed:needed,progress:count/needed*100,sub:sub};
 }
 if(id==="tegner"){if(vals.level===undefined||vals.level==="")return {valid:false,value:null,max:max,answered:0,needed:1,progress:0};return {valid:true,value:Number(vals.level),max:max,answered:1,needed:1,progress:100,sub:"Niveau d’activité ordinal"};}
 var parts=id==="constant"?[{key:"pain",max:15},{key:"adl",max:20},{key:"rom",max:40},{key:"strength",max:25}]:[{key:"pain",max:44},{key:"function",max:47},{key:"deformity",max:4},{key:"rom",max:5}];
 needed=parts.length;
 for(i=0;i<parts.length;i++){var value=vals[parts[i].key];if(value!==undefined&&value!==""){count++;if(Number(value)<0||Number(value)>parts[i].max)return {valid:false,value:null,max:max,answered:count,needed:needed,progress:count/needed*100,sub:"Valeur hors plage"};total+=Number(value);}}
 if(count!==needed)return {valid:false,value:null,max:max,answered:count,needed:needed,progress:count/needed*100,sub:""};
 sub=parts.map(function(p){return p.key+" "+vals[p.key]+"/"+p.max;}).join(" · ");
 return {valid:true,value:total,max:max,answered:count,needed:needed,progress:100,sub:sub};

function download(name,content,type){var blob=new Blob([content],{type:type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}

function exportCSV(){var rows=[["code_pseudonyme","diagnostic","region","cote","intervention","date_intervention","date_consultation","etape","EVA","cicatrice","marche","score","valeur","maximum","direction","detail_score","note_non_nominative"]];state.patients.forEach(function(p){(p.visits||[]).forEach(function(v){var ss=v.scores||[];if(!ss.length)rows.push([p.code,p.diagnosis,p.region,p.side,p.procedure,p.surgeryDate,v.date,v.stage,v.pain,v.wound,v.gait,"","","","","",v.note]);else ss.forEach(function(s){rows.push([p.code,p.diagnosis,p.region,p.side,p.procedure,p.surgeryDate,v.date,v.stage,v.pain,v.wound,v.gait,s.name,s.value,s.max,s.direction,s.sub,v.note]);});});});var csv="\uFEFF"+rows.map(function(row){return row.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(";");}).join("\r\n");download("orthosuivi-scores-"+today()+".csv",csv,"text/csv;charset=utf-8;");}
function importJSON(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!data||data.format!=="OrthoSuiviBackup"||!Array.isArray(data.patients))throw Error("format");if(!confirm("Remplacer les données locales par "+data.patients.length+" dossiers importés ?"))return;state.patients=data.patients;save();state.view="dashboard";render();alert("Sauvegarde restaurée.");}catch(err){alert("Fichier invalide : choisissez une sauvegarde JSON OrthoSuivi.");}e.target.value="";};reader.readAsText(file);}
document.querySelectorAll("[data-view]").forEach(function(b){b.onclick=function(){state.view=b.dataset.view;state.query="";render();};});
$("#quickAdd").onclick=function(){state.editingPatient=null;state.view="newpatient";render();};
render();
})();
