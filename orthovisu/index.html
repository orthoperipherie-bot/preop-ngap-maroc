<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101619">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OrthoVisu">
<meta name="description" content="Atlas visuel orthopédique pour consultation.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>OrthoVisu — Atlas visuel</title>
<style>
:root{color-scheme:dark;--bg:#101619;--panel:#192226;--panel2:#202c31;--ink:#f0f4f3;--muted:#a9b7b6;--line:#344247;--accent:#9fc9bb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{min-height:100svh}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.top{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#131b1f;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:850;letter-spacing:2.5px}.brandmark{width:28px;height:28px;border:1px solid #87b7a8;border-radius:8px;display:grid;place-items:center;color:var(--accent);font:italic 20px Georgia}.topactions{display:flex;gap:8px}.topbtn,.iconbtn{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:8px 11px;font-size:12px;color:#dfe8e5}.iconbtn{width:38px;height:38px;padding:0;font-size:19px;display:grid;place-items:center}
main{max-width:1180px;margin:auto;padding:18px 18px 28px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{height:42px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1;min-width:170px}.search span{font-size:18px;color:var(--accent)}.search input{background:transparent;color:var(--ink);border:0;outline:0;width:100%;min-width:0;font-size:13px}.search input::placeholder{color:#849493}.regions{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:4px 0 14px}.regions::-webkit-scrollbar{display:none}.region{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:20px;padding:8px 13px;font-size:11px}.region.active{background:#d8e9e2;border-color:#d8e9e2;color:#172923;font-weight:800}
.count{display:flex;justify-content:space-between;color:#7e908e;font-size:10px;letter-spacing:1.5px;font-weight:800;margin:3px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.case{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;padding:0;text-align:left;min-width:0;transition:border-color .15s,transform .15s}.case:active{transform:scale(.99)}.case:hover{border-color:#81ab9e}.cover{height:190px;background:#f1f3f1;display:grid;place-items:center;overflow:hidden;padding:8px}.cover img{width:100%;height:100%;object-fit:contain}.casename{padding:12px 13px 13px;font-size:13px;font-weight:700;letter-spacing:.1px;display:flex;align-items:center;justify-content:space-between;gap:8px}.casename span:last-child{color:var(--accent);font-size:18px}
.hidden{display:none!important}
.viewer{position:fixed;inset:0;z-index:20;background:#080c0e;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.viewerbar{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #344044;background:#101719}.viewername{font-size:13px;font-weight:750;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counter{font-size:11px;color:#a8b6b4;min-width:34px;text-align:right}.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:pan-y;background:#080c0e}.mainimage{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;transition:transform .18s ease;user-select:none;-webkit-user-drag:none;cursor:zoom-in}.mainimage.zoomed{cursor:zoom-out}.navarrow{position:absolute;top:50%;transform:translateY(-50%);border:1px solid #ffffff30;background:#111a1dcc;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:24px;color:#fff;z-index:2}.navarrow.prev{left:10px}.navarrow.next{right:10px}.viewerfoot{background:#101719;border-top:1px solid #344044}.viewercontrols{height:47px;display:flex;align-items:center;justify-content:center;gap:9px}.smallbtn{min-width:37px;height:31px;border:1px solid #39494d;border-radius:8px;background:#1a2529;color:#dce6e2;padding:0 10px;font-size:13px}.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom));scrollbar-width:none}.thumbs::-webkit-scrollbar{display:none}.thumb{flex:0 0 62px;width:62px;height:56px;border:2px solid transparent;border-radius:7px;background:#edf0ed;padding:2px;overflow:hidden}.thumb.active{border-color:var(--accent)}.thumb img{width:100%;height:100%;object-fit:contain}.modal{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modalbox{width:min(100%,760px);max-height:82svh;overflow:auto;background:#182226;border:1px solid #405055;border-radius:16px;padding:17px}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modalhead h2{font-size:16px;margin:0}.credit{padding:12px 0;border-top:1px solid #354449;font-size:12px;line-height:1.55}.credit strong{display:block;font-size:13px;margin-bottom:3px}.credit a{color:#aad5c6;text-decoration:underline;text-underline-offset:2px}.credit small{display:block;color:#a8b7b4;margin-top:4px}.empty{padding:36px 12px;text-align:center;color:var(--muted)}
@media(max-width:760px){main{padding:12px 12px 22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cover{height:155px}.casename{font-size:12px;padding:10px}.top{padding:0 12px}.brand{font-size:12px}}
@media(max-width:390px){.cover{height:132px}.case{border-radius:10px}.casename{font-size:11px}}
@media(orientation:landscape) and (max-height:500px){.viewerbar{height:44px;flex-basis:44px}.thumbs{padding-top:4px;padding-bottom:4px}.thumb{height:43px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="brandmark">O</span><span>ORTHOVISU</span></div><div class="topactions"><button class="topbtn" id="allSources">Sources & licences</button></div></header>
<main id="home">
<div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Rechercher une pathologie…" autocomplete="off"></label><button class="iconbtn" id="reset" aria-label="Effacer la recherche">↺</button></div>
<nav class="regions" id="regions"></nav>
<div class="count"><span>ATLAS VISUEL</span><span id="count"></span></div>
<div class="grid" id="grid"></div>
<div class="empty hidden" id="empty">Aucune image pour cette recherche.</div>
</main>
<section class="viewer hidden" id="viewer" aria-label="Visualiseur d'images">
<div class="viewerbar"><button class="iconbtn" id="back" aria-label="Retour">←</button><div class="viewername" id="viewerName"></div><div class="counter" id="counter"></div><button class="iconbtn" id="currentSources" aria-label="Sources et licences">ⓘ</button></div>
<div class="stage" id="stage"><button class="navarrow prev" id="prev" aria-label="Image précédente">‹</button><img class="mainimage" id="mainImage" alt="" draggable="false"><button class="navarrow next" id="next" aria-label="Image suivante">›</button></div>
<div class="viewerfoot"><div class="viewercontrols"><button class="smallbtn" id="zoomOut" aria-label="Dézoomer">−</button><button class="smallbtn" id="zoomReset">Ajuster</button><button class="smallbtn" id="zoomIn" aria-label="Zoomer">＋</button><button class="smallbtn" id="full">Plein écran ⛶</button></div><div class="thumbs" id="thumbs"></div></div>
</section>
<div class="modal hidden" id="creditsModal"><section class="modalbox"><div class="modalhead"><h2>Sources iconographiques et licences</h2><button class="iconbtn" id="closeCredits" aria-label="Fermer">×</button></div><div id="creditList"></div></section></div>
<script>
const LICENSES={
  "CC BY-SA 4.0":"https://creativecommons.org/licenses/by-sa/4.0/",
  "CC BY 4.0":"https://creativecommons.org/licenses/by/4.0/",
  "CC BY 3.0":"https://creativecommons.org/licenses/by/3.0/"
};
const images={
  kneeNormal:{name:"Healthy knee joint.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/a/a6/Healthy_knee_joint.svg",source:"https://commons.wikimedia.org/wiki/File:Healthy_knee_joint.svg"},
  kneeAnatomy:{name:"Knee anatomy.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/8/82/Knee_anatomy.svg",source:"https://commons.wikimedia.org/wiki/File:Knee_anatomy.svg"},
  kneeOA:{name:"Knee Osteoarthritis.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/9/9e/Knee_Osteoarthritis.svg",source:"https://commons.wikimedia.org/wiki/File:Knee_Osteoarthritis.svg"},
  kneeInjuries:{name:"Knee injuries.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/e/e1/Knee_injuries.svg",source:"https://commons.wikimedia.org/wiki/File:Knee_injuries.svg"},
  acl:{name:"Anterior Cruciate Ligament Tear.jpg",author:"BruceBlaus",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/9/9c/Anterior_Cruciate_Ligament_Tear.jpg",source:"https://commons.wikimedia.org/wiki/File:Anterior_Cruciate_Ligament_Tear.jpg"},
  cuff:{name:"Rotator cuff injury.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/c/c5/Rotator_cuff_injury.svg",source:"https://commons.wikimedia.org/wiki/File:Rotator_cuff_injury.svg"},
  hipAnatomy:{name:"Hip anatomy.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/5/5b/Hip_anatomy.svg",source:"https://commons.wikimedia.org/wiki/File:Hip_anatomy.svg"},
  hipOA:{name:"Hip osteoarthritis.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/3/3d/Hip_osteoarthritis.svg",source:"https://commons.wikimedia.org/wiki/File:Hip_osteoarthritis.svg"},
  spineNormal:{name:"Healthy spine.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/a/a8/Healthy_spine.svg",source:"https://commons.wikimedia.org/wiki/File:Healthy_spine.svg"},
  hernia:{name:"Herniated disk.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/5/52/Herniated_disk.svg",source:"https://commons.wikimedia.org/wiki/File:Herniated_disk.svg"},
  disk:{name:"Degenerated disk.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/b/b2/Degenerated_disk.svg",source:"https://commons.wikimedia.org/wiki/File:Degenerated_disk.svg"},
  radius:{name:"Distalradiusfracture.jpg",author:"Curtishand (photographie : Dr Keith Segalman, Curtis National Hand Center)",license:"Domaine public (notice Commons)",url:"https://upload.wikimedia.org/wikipedia/commons/d/d7/Distalradiusfracture.jpg",source:"https://commons.wikimedia.org/wiki/File:Distalradiusfracture.jpg"},
  radiusPins:{name:"Pins across a distal radius fracture.jpg",author:"Curtishand",license:"Domaine public (notice Commons)",url:"https://upload.wikimedia.org/wikipedia/commons/0/06/Pins_across_a_distal_radius_fracture.jpg",source:"https://commons.wikimedia.org/wiki/File:Pins_across_a_distal_radius_fracture.jpg"},
  hallux:{name:"Halluxvalgus.jpg",author:"2braqu",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/7/70/Halluxvalgus.jpg",source:"https://commons.wikimedia.org/wiki/File:Halluxvalgus.jpg"},
  scoliosis:{name:"Blausen 0785 Scoliosis 01.png",author:"BruceBlaus / Blausen Medical",license:"CC BY 3.0",url:"https://upload.wikimedia.org/wikipedia/commons/a/a7/Blausen_0785_Scoliosis_01.png",source:"https://commons.wikimedia.org/wiki/File:Blausen_0785_Scoliosis_01.png"},
  carpal:{name:"Carpal Tunnel Syndrome.jpg",author:"Manu5 / Top Medical Animation Studio",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/e/ed/Carpal_Tunnel_Syndrome.jpg",source:"https://commons.wikimedia.org/wiki/File:Carpal_Tunnel_Syndrome.jpg"},
  ankle:{name:"Ankle pain.svg",author:"InjuryMap",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/e/e9/Ankle_pain.svg",source:"https://commons.wikimedia.org/wiki/File:Ankle_pain.svg"},
  bimalleolar:{name:"X-ray of bimalleolar fracture.jpg",author:"Nazzar Tellisi, I. S. Abdulkareem, P. G. Giannoudis",license:"CC BY 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/c/c5/X-ray_of_bimalleolar_fracture.jpg",source:"https://commons.wikimedia.org/wiki/File:X-ray_of_bimalleolar_fracture.jpg"},
  trimalleolar:{name:"Trimalleolar Ankle Fracture.jpg",author:"Chaim Mintz",license:"CC BY-SA 4.0",url:"https://upload.wikimedia.org/wikipedia/commons/b/bf/Trimalleolar_Ankle_Fracture.jpg",source:"https://commons.wikimedia.org/wiki/File:Trimalleolar_Ankle_Fracture.jpg"}
};
const grayPlate=(name,plate,description)=>({name,author:"Henry Vandyke Carter — Gray's Anatomy, 20e édition (1918)",license:"Domaine public (édition de 1918 ; vérifier la notice de chaque scan)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/"+name,source:"https://commons.wikimedia.org/wiki/File:"+name,description});
Object.assign(images,{
  grayKneeFront:grayPlate("Gray347.png","347","Articulation du genou, vue antérieure, ligaments internes"),
  grayKneeBack:grayPlate("Gray348.png","348","Articulation du genou, vue postérieure, ligaments internes"),
  grayKneeBackAlt:grayPlate("Gray346.png","346","Articulation du genou, vue postérieure"),
  grayShoulder:grayPlate("Gray327.png","327","Capsule de l'articulation gléno-humérale, vue antérieure"),
  grayShoulderMuscles:{name:"Arm shoulder gray.png",author:"Henry Gray / H. V. Carter — Gray's Anatomy (1918), scan Commons",license:"Domaine public (édition de 1918 ; vérifier la notice du scan)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/Arm_shoulder_gray.png",source:"https://commons.wikimedia.org/wiki/File:Arm_shoulder_gray.png"},
  graySpine:grayPlate("Gray_111_-_Vertebral_column-coloured.png","111","Colonne vertébrale, vue latérale"),
  grayWristFlexor:grayPlate("Gray1233.png","1233","Gaines synoviales des tendons fléchisseurs du poignet et des doigts"),
  grayWristExtensor:grayPlate("Gray1234.png","1234","Gaines synoviales des tendons extenseurs du poignet"),
  grayFoot:grayPlate("Gray354.png","354","Ligaments de la face médiale du pied"),
  grayHand:grayPlate("Gray424.png","424","Tendons extenseurs de l'avant-bras et de la main"),
  grayHipFront:grayPlate("Gray342.png","342","Articulation coxo-fémorale, vue antérieure"),
  grayHipPosterior:grayPlate("Gray343.png","343","Capsule de l'articulation coxo-fémorale, vue postérieure"),
  grayHipOpened:grayPlate("Gray341.png","341","Articulation coxo-fémorale ouverte, vue depuis le bassin")

  grayFootLateral:grayPlate("Gray355.png","355","Ligaments latéraux du pied"),
  servierKnee:{name:"Knee - Frontal view -- Smart-Servier.png",author:"Laboratoires Servier — Servier Medical Art",license:"CC BY-SA 3.0 (licence du fichier Commons)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/Knee_-_Frontal_view_--_Smart-Servier.png",source:"https://commons.wikimedia.org/wiki/File:Knee_-_Frontal_view_--_Smart-Servier.png"},
  servierKneeSagittal:{name:"Knee - Parasagittal section -- Smart-Servier.png",author:"Laboratoires Servier — Servier Medical Art",license:"CC BY-SA 3.0 (licence du fichier Commons)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/Knee_-_Parasagittal_section_--_Smart-Servier.png",source:"https://commons.wikimedia.org/wiki/File:Knee_-_Parasagittal_section_--_Smart-Servier.png"},
  servierDisc:{name:"Disc herniation -- Smart-Servier.png",author:"Laboratoires Servier — Servier Medical Art",license:"CC BY-SA 3.0 (licence du fichier Commons)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/Disc_herniation_--_Smart-Servier.png",source:"https://commons.wikimedia.org/wiki/File:Disc_herniation_--_Smart-Servier.png"},
  servierDiscStages:{name:"Disc herniation - Degeneration -- Smart-Servier.png",author:"Laboratoires Servier — Servier Medical Art",license:"CC BY-SA 3.0 (licence du fichier Commons)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/Disc_herniation_-_Degeneration_--_Smart-Servier.png",source:"https://commons.wikimedia.org/wiki/File:Disc_herniation_-_Degeneration_--_Smart-Servier.png"},
  servierOsteoarthritis:{name:"Osteoarthritis -- Smart-Servier.jpg",author:"Laboratoires Servier — Servier Medical Art",license:"CC BY-SA 3.0 (licence du fichier Commons)",url:"https://commons.wikimedia.org/wiki/Special:FilePath/Osteoarthritis_--_Smart-Servier.jpg",source:"https://commons.wikimedia.org/wiki/File:Osteoarthritis_--_Smart-Servier.jpg"}

});
const cases=[
{id:"gonarthrose",name:"Gonarthrose",region:"Genou",images:["grayKneeFront","grayKneeBack","servierKnee","servierKneeSagittal","servierOsteoarthritis","kneeNormal","kneeOA"]},
{id:"lca",name:"Rupture du LCA",region:"Genou",images:["grayKneeFront","grayKneeBack","servierKnee","servierKneeSagittal","acl","kneeInjuries"]},
{id:"menisque",name:"Lésion méniscale",region:"Genou",images:["grayKneeFront","grayKneeBack","servierKnee","servierKneeSagittal","kneeInjuries"]},
{id:"coiffe",name:"Rupture de la coiffe",region:"Épaule",images:["grayShoulder","cuff"]},
{id:"coxarthrose",name:"Coxarthrose",region:"Hanche",images:["grayHipFront","grayHipPosterior","grayHipOpened","hipAnatomy","hipOA","servierOsteoarthritis"]},
{id:"hernie",name:"Hernie discale lombaire",region:"Rachis",images:["servierDisc","servierDiscStages","spineNormal","hernia","disk","graySpine"]},
{id:"radius",name:"Fracture du radius distal",region:"Poignet",images:["radius","radiusPins","grayWristFlexor","grayWristExtensor","grayHand"]},
{id:"hallux",name:"Hallux valgus",region:"Pied",images:["grayFoot","grayFootLateral","hallux"]},
{id:"scoliose",name:"Scoliose",region:"Rachis",images:["scoliosis"]},
{id:"canal",name:"Canal carpien",region:"Main",images:["carpal","grayWristFlexor","grayWristExtensor","grayHand"]},
{id:"cheville",name:"Entorse latérale de cheville",region:"Cheville",images:["grayFoot","grayFootLateral","ankle"]},
{id:"bimalleolaire",name:"Fracture bi-/trimalléolaire",region:"Cheville",images:["bimalleolar","trimalleolar"]}
];
const regions=["Tous","Genou","Épaule","Hanche","Rachis","Poignet","Pied","Main","Cheville"];
const $=id=>document.getElementById(id);
let activeRegion="Tous",searchTerm="",currentCase=null,currentIndex=0,zoom=1;
function renderRegions(){
  $("regions").innerHTML=regions.map(r=>'<button class="region '+(activeRegion===r?'active':'')+'" data-region="'+r+'">'+r+'</button>').join("");
}
function renderGrid(){
  const list=cases.filter(c=>(activeRegion==="Tous"||c.region===activeRegion)&&(c.name.toLowerCase().includes(searchTerm.toLowerCase())||c.region.toLowerCase().includes(searchTerm.toLowerCase())));
  $("count").textContent=list.length+" / "+cases.length;
  $("grid").innerHTML=list.map(c=>'<button class="case" data-case="'+c.id+'"><div class="cover"><img loading="lazy" src="'+images[c.images[0]].url+'" alt=""></div><div class="casename"><span>'+c.name+'</span><span>›</span></div></button>').join("");
  $("empty").classList.toggle("hidden",list.length>0);
}
function showCase(id){
  currentCase=cases.find(c=>c.id===id);currentIndex=0;zoom=1;
  if(!currentCase)return;
  $("home").classList.add("hidden");$("viewer").classList.remove("hidden");
  renderViewer();history.replaceState(null,"","#"+id);
}
function renderViewer(){
  const asset=images[currentCase.images[currentIndex]];
  $("viewerName").textContent=currentCase.name;
  $("counter").textContent=(currentIndex+1)+" / "+currentCase.images.length;
  $("mainImage").src=asset.url;
  $("mainImage").classList.remove("zoomed");
  $("mainImage").style.transform="scale(1)";
  zoom=1;
  $("thumbs").innerHTML=currentCase.images.map((key,i)=>'<button class="thumb '+(i===currentIndex?'active':'')+'" data-index="'+i+'" aria-label="Image '+(i+1)+'"><img loading="lazy" src="'+images[key].url+'" alt=""></button>').join("");
  $("prev").style.visibility=currentCase.images.length>1?"visible":"hidden";
  $("next").style.visibility=currentCase.images.length>1?"visible":"hidden";
}
function move(step){
  if(!currentCase)return;
  currentIndex=(currentIndex+step+currentCase.images.length)%currentCase.images.length;
  renderViewer();
}
function closeViewer(){
  $("viewer").classList.add("hidden");$("home").classList.remove("hidden");currentCase=null;history.replaceState(null,"",location.pathname);
}
function changeZoom(value){
  zoom=Math.max(1,Math.min(3,zoom+value));
  $("mainImage").style.transform="scale("+zoom+")";
  $("mainImage").classList.toggle("zoomed",zoom>1);
}
function renderCredits(){
  const keys=currentCase?currentCase.images:Object.keys(images);
  const unique=[...new Set(keys)];
  $("creditList").innerHTML=unique.map(key=>{
    const a=images[key],licenseUrl=a.licenseUrl||LICENSES[a.license];
    return '<article class="credit"><strong>'+a.name+'</strong><div>Auteur : '+a.author+'</div><div>Licence : '+a.license+(licenseUrl?' — <a href="'+licenseUrl+'" target="_blank" rel="noopener">conditions de licence</a>':'')+'</div><small><a href="'+a.source+'" target="_blank" rel="noopener">Notice de la source / attribution</a> · Fichier affiché sans modification</small></article>';
  }).join("");
  $("creditsModal").classList.remove("hidden");
}
$("regions").addEventListener("click",e=>{const b=e.target.closest("[data-region]");if(!b)return;activeRegion=b.dataset.region;renderRegions();renderGrid();});
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-case]");if(b)showCase(b.dataset.case);});
$("search").addEventListener("input",e=>{searchTerm=e.target.value;renderGrid();});
$("reset").addEventListener("click",()=>{$("search").value="";searchTerm="";activeRegion="Tous";renderRegions();renderGrid();});
$("back").addEventListener("click",closeViewer);
$("prev").addEventListener("click",()=>move(-1));
$("next").addEventListener("click",()=>move(1));
$("thumbs").addEventListener("click",e=>{const b=e.target.closest("[data-index]");if(!b)return;currentIndex=Number(b.dataset.index);renderViewer();});
$("zoomIn").addEventListener("click",()=>changeZoom(.25));
$("zoomOut").addEventListener("click",()=>changeZoom(-.25));
$("zoomReset").addEventListener("click",()=>{zoom=1;$("mainImage").style.transform="scale(1)";$("mainImage").classList.remove("zoomed");});
$("mainImage").addEventListener("dblclick",()=>{zoom=zoom===1?2:1;$("mainImage").style.transform="scale("+zoom+")";$("mainImage").classList.toggle("zoomed",zoom>1);});
$("full").addEventListener("click",()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
$("allSources").addEventListener("click",renderCredits);
$("currentSources").addEventListener("click",renderCredits);
$("closeCredits").addEventListener("click",()=>$("creditsModal").classList.add("hidden"));
$("creditsModal").addEventListener("click",e=>{if(e.target===$("creditsModal"))$("creditsModal").classList.add("hidden");});
let touchStart=0;
$("stage").addEventListener("touchstart",e=>{if(e.touches.length===1)touchStart=e.touches[0].clientX;},{passive:true});
$("stage").addEventListener("touchend",e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart;touchStart=0;if(Math.abs(dx)>65)move(dx<0?1:-1);},{passive:true});
document.addEventListener("keydown",e=>{if($("viewer").classList.contains("hidden"))return;if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1);if(e.key==="Escape"){if(!$("creditsModal").classList.contains("hidden"))$("creditsModal").classList.add("hidden");else closeViewer();}});
renderRegions();renderGrid();
if(location.hash){const id=location.hash.slice(1);if(cases.some(c=>c.id===id))showCase(id);}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{}));
</script>
</body>
</html>
